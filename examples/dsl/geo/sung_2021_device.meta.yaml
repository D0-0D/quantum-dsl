schema: qiskit-metal/design-dsl/3

vars: {}

cells:
  - cell_type: transmon_pocket
    component: QB1
    x: "-900um"
    params:
      connection_pads: {}

  - cell_type: transmon_pocket
    component: CPLR
    x: "0um"
    params:
      connection_pads: {}

  - cell_type: transmon_pocket
    component: QB2
    x: "900um"
    params:
      connection_pads: {}

circuit_model:
  # All three are FLOATING (differential) transmons: the junction bridges the
  # two pads, neither of which touches ground.  Declaring one island instead
  # silently grounds the other pad — 1.70× on C_Σ / E_C for this device.
  qubits:
    - name: QB1
      islands: [metal::1::QB1::pad_top, metal::1::QB1::pad_bot]
      E_J: 12.2GHz
    - name: CPLR
      islands: [metal::1::CPLR::pad_top, metal::1::CPLR::pad_bot]
      E_J: 71GHz
    - name: QB2
      islands: [metal::1::QB2::pad_top, metal::1::QB2::pad_bot]
      E_J: 15.8GHz

simulation:
  gmsh:
