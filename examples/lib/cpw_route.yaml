# cpw_route — 自动布线 CPW (连接型 + planner: cpw): 两个**不必正对**的端口之间, 编排器用 route.plan_cpw 在芯片坐标里规划中心线
# = 直段 + 圆弧序列 (弯半径 R), 逐段注入列表变量 _rt_*, 本模板的 .geo 用 LIB_CPW / LIB_CPW_ARC 画面。
# 骨架默认走曼哈顿框架 (横平竖直; 步骤键 axis: 角度可转框架, axis: free = Dubins 自由角); 步骤键 region: 一个矩形或若干矩形的并集
# (芯片坐标, 全部原语含缝宽须落在其内, 拼接可挡路 → 绕路); 步骤 length: (同 cpw_meander: 减两端 leq 后注入 L) 时在骨架的某条直段上
# 放蛇形补长: 每个弯按该处余量 (区域边 / 矩形之间的缝 / 本条路自己的直段, 净距 2R) 独立外推, 腿因此可不等长; n_legs: 0 = 腿数自动取最小可行
# (须给 region), 显式 n_legs 则用那么多腿。lead: 两端各先沿端口法向直走 lead µm 再开始拐弯 (端口面上永远是一段直的 CPW; 0 = 关掉)。
# 设计稿 docs/design/auto-route.md。
schema: quantum-dsl/template/1
kind: connect
planner: cpw
params: {R: 40, n_legs: 0, gap: 6, lead: 60}
layers: {metal: conductor}
islands: {cpw: {faces: cpw_centre(), layer: metal}}     # 路由体: 与两端并成一个 net
etch: [{faces: cpw_etch(), layer: metal}]
outputs: {length: cpw_length}                           # 步骤给 length: 时必须 == 注入的 L
