# two_pads.meta.yaml — two_pads.geo 的 Layer-1 sidecar (词汇见 docs/grammar.md)。
# 刻意做小 (浅衬底 + 紧凑 airbox + 粗网格): 真实 Palace 求解单核分钟级。
# 零厚度片配方实测 Maxwell C = [[24.5324, -1.9472], [-1.9472, 24.5353]] fF
# (回归锚, docs/physics.md「网格与收敛」)。side_um=80 是刻意小型化的回归件,
# 不是物理推荐值 —— 给真实器件报数应做域尺寸扫。

schema: quantum-dsl/meta/1

geo: two_pads.geo

materials:
  substrate: {eps_r: 11.45, thickness_um: 100}

airbox: {top_um: 120, bottom_um: 120, side_um: 80}

mesh: {max_size_um: 40, min_size_um: 4}

solver: {type: electrostatic, order: 2}

gds:
  by_role:
    metal: {layer: 1, datatype: 0}

# 每块焊盘 = 一个对地单岛 transmon, 10 nH 结; 非对角给 A↔B 耦合。
circuit_model:
  qubits:
    - {name: A, island: A, L_J: 10nH}
    - {name: B, island: B, L_J: 10nH}
