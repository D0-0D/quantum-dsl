# xmon_feedline_tune.meta.yaml — 带馈线的 FEM 在环综合: 同一 xmon_feedline 版图 (cpw_route λ/2 读出腔 + feed_tap 焊盘 + pad 馈线), 5 个目标 + 5 个旋钮 (方阵),
# tune() 迭代到全部命中, 产出普通的 layout + meta。跑法: quantum_dsl.tune("examples/xmon_feedline_tune.meta.yaml", "build/xf_tune")。
# 规格取 κ = 2|χ| (色散读出 SNR 最优点): f01 4.8 / α −250 MHz, f_r 7.2 GHz, χ −0.2 MHz, κ/2π 0.4 MHz。
#   几何旋钮 (每轮一次整片 FEM): Q1.arm_L → α (law −1)、Q1.ro_gap → χ (law −1)、R1.length.f_r → 负载后 f_r (law 1, cpw_route 每轮按新长度重新规划蛇形)、
#            T1.tap_h → κ (κ ∝ C_κ², C_κ 随焊盘沿馈线的长度涨: law 2)。律只需趋势对, 第二轮起换观测指数 (在 law 的 ¼–4 倍内才用)。
#   结旋钮 (缓存的 C 上二分, 不跑 FEM): Q1.E_J → f01_exact。
# tol 必须高过重网格噪声底: 这档 200/20 网格同几何亚 µm 平移重解, κ 散 ±5.5% (σ ≈ 5%)、χ ±3.3%、C_Σ ±0.3%、f_r ±0.01%
# (docs/physics.md §8.1) → κ 10%、χ 5% (≈ 2σ); κ 5% 时实测 8 轮在 0.35–0.45 之间来回跳不收敛。腔的 f_r 紧、κ 松 → tol 写成逐字段 mapping。
# 网格刻意粗 (演示件): 细一档 (min 10 µm) κ −28%、C_Σ −5.5% —— 报数前做 converge()。
schema: quantum-dsl/meta/1

layout: xmon_feedline.layout.yaml
layers:
  m1: {kind: conductor, gds: [1, 0]}
  jj: {kind: junction,  gds: [20, 0]}

materials:
  substrate: {eps_r: 11.45, thickness_um: 500}
airbox: {top_um: 600, bottom_um: 800, side_um: 200}
mesh: {max_size_um: 200, min_size_um: 20}
solver: {type: electrostatic, order: 2, outer_boundary: open}

circuit_model:
  ports: [{name: feed, net: FL, R: 25.5Ohm}]

targets:
  source: 演示规格 (κ = 2|χ|, 非论文值)
  qubits: {Q1: {anharmonicity_exact_MHz: -250, f01_exact_GHz: 4.8, tol: 1%}}
  resonators: {R1: {f_r_GHz: 7.2, kappa_MHz: 0.4, tol: {f_r_GHz: 0.2%, kappa_MHz: 10%}}}
  readout: [{pair: [Q1, R1], chi_MHz: -0.2, tol: 5%}]

tune:
  knobs:
    - {param: Q1.arm_L, target: Q1.anharmonicity_exact_MHz, law: -1, bounds: [150, 500]}
    - {param: Q1.ro_gap, target: Q1~R1.chi_MHz, law: -1, bounds: [4, 60]}
    - {param: R1.length.f_r, target: R1.f_r_GHz, law: 1}
    - {param: T1.tap_h, target: R1.kappa_MHz, law: 2, bounds: [20, 600]}
    - {param: Q1.E_J, target: Q1.f01_exact_GHz}
  max_iter: 8
