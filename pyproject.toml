[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-dsl"
version = "4.0.0"
description = "Superconducting quantum-chip layout DSL: native Gmsh .geo + meta.yaml -> GDS / Palace electrostatics -> circuit model."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "D0-0D" }]
keywords = ["superconducting", "quantum", "eda", "gmsh", "palace", "gds"]
dependencies = [
    "pyyaml>=5.4",
    "shapely>=2",
    "threadpoolctl>=3",   # 小矩阵 BLAS 压单线程 (circuit_model 静态 ZZ / gates 的 expm; OpenBLAS 多线程慢百倍)
]

[project.optional-dependencies]
# 网格分叉 (build_mesh / palace_config) 需要 gmsh; GDS 分叉需要 gdstk (+ pillow 出 PNG 预览)。
# `import quantum_dsl` 不得拉起它们 (契约「import 纯度」)。
gmsh = ["gmsh>=4.13"]
gds = ["gdstk>=0.9.53", "pillow>=9"]
# 门仿真 (simulate_gates / meta gates:): SuperGrad 拉 jax / dm-haiku / jaxopt (已停止维护) —— 钉在实测过的版本
gates = ["supergrad==0.2.6", "jax>=0.12,<0.13"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_dsl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
